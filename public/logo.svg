<svg xmlns="http://www.w3.org/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant brand-600 gradient for premium aesthetics -->
    <linearGradient id="bloodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>
  
  <!-- Outer glowing background circle (subtle) -->
  <circle cx="50" cy="50" r="46" fill="#fff1f1" opacity="0.6" stroke="#ffcccc" stroke-width="1.5" />
  
  <!-- Blood Drop Shape -->
  <path d="M 50,15 
           C 72,40 85,58 85,70 
           A 35,35 0 0,1 15,70 
           C 15,58 28,40 50,15 Z" 
        fill="url(#bloodGradient)" 
        filter="url(#subtleShadow)" />
        
  <!-- Embedded Heart Shape in White for ResQ Concept -->
  <path d="M 50,50
           C 50,50 42,43 35,48
           C 30,52 30,60 36,65
           L 50,78
           L 64,65
           C 70,60 70,52 65,48
           C 58,43 50,50 50,50 Z" 
        fill="#ffffff" />
        
  <!-- Tiny highlight bubble for glossy look -->
  <circle cx="38" cy="42" r="4" fill="#ffffff" opacity="0.3" />
</svg>
